services:
  familypro:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_TZ=Europe/Madrid
      - ADMIN_NAME=admin   # nombre del primer usuario (solo se usa la primera vez)
      # - DATABASE_URL=postgresql://...   # opcional: usar Supabase en lugar de la base de datos local
    volumes:
      - ./data:/data
